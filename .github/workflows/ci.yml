name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Install Playwright browser (component tests)
        run: npx playwright install --with-deps chromium

      - name: Unit & component tests
        run: npm test

      - name: Core coverage (thresholds enforced)
        run: npm run test:coverage

      - name: Build
        run: npm run build
